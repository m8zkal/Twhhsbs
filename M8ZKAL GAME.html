<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M8ZKAL GAME</title>
    
    <!-- Firebase + simple-peer -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            touch-action: pan-y;
        }
        #menu, #game-container, #screen-victory {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }
        #game-container, #screen-victory { display: none; }

        #game-container {
            height: 100vh;
            overflow: hidden;
            padding: 0 10px 10px 10px;
            position: relative;
            justify-content: flex-start;
            gap: 8px;
            background: transparent;
        }

        #hud, #survival-hud {
            flex-shrink: 0;
            width: 100%;
            max-width: 700px;
            max-height: 35vh;
            overflow-y: auto;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 6px 10px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        #survival-hud { display: none; }

        .hud-player {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 3px 6px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 3px;
        }
        .hp-container {
            background: linear-gradient(180deg, #1a1a1a 0%, #2c2c2c 100%);
            border-radius: 6px;
            height: 16px;
            position: relative;
            border: 1px solid #333;
            overflow: hidden;
        }
        .hp-bar {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
            position: absolute;
            top: 0; left: 0;
        }
        .hp-text {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 1px #000;
            width: 100%;
            height: 100%;
        }

        /* Увеличен отступ снизу для панели режимов */
        #mode-tabs {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 5px;
            margin-bottom: 40px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 4px;
        }
        .mode-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #aaa;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .mode-tab:hover:not(.active) { color: #fff; }
        .mode-tab.active {
            background: linear-gradient(135deg, #34c759 0%, #28a745 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(52,199,89,0.4);
        }

        h1 { font-size: clamp(20px, 5vw, 32px); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; text-align: center; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        
        /* Единый стиль для меню выбора игрока (PvP, КБ, Выживание) */
        #battle-settings, #survival-settings, #pvp-settings {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 40px auto;
        }
        #battle-settings > * + *, #survival-settings > * + *, #pvp-settings > * + * {
            margin-top: 20px;
        }
        #battle-settings .player-input-group, #survival-settings .player-input-group, #pvp-settings .player-input-group {
            margin-bottom: 0;
        }

        .player-input-group {
            background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%); padding: 15px; border-radius: 15px;
            width: 100%; border: 2px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .p1-border { border-left: 5px solid #ff3b30; } .p2-border { border-left: 5px solid #007aff; }
        .p3-border { border-left: 5px solid #34c759; } .p4-border { border-left: 5px solid #ff9500; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 80px 10px 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #34c759;
            box-shadow: 0 0 10px rgba(52,199,89,0.3);
        }
        .input-buttons {
            position: absolute;
            right: 5px;
            display: flex;
            gap: 5px;
        }
        .input-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            background: #3a3a3a;
            border: 1px solid #555;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-btn:hover { background: #4a4a4a; border-color: #666; }
        .input-btn.clear-btn { color: #ff6b6b; }
        .input-btn.paste-btn { color: #4da6ff; }
        .input-btn.copy-btn { color: #ffd700; }
        
        .image-preview { width: 100%; height: 80px; background: #1a1a1a; border: 2px dashed #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 8px; cursor: pointer; }
        .image-preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .image-preview .placeholder { color: #666; font-size: 14px; pointer-events: none; }
        
        button { width: 100%; padding: 16px; background: linear-gradient(135deg, #34c759 0%, #28a745 100%); color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(52,199,89,0.4); transition: all 0.3s ease; margin-bottom: 10px; }
        button:hover { background: linear-gradient(135deg, #2ec051 0%, #23923c 100%); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(52,199,89,0.6); }
        #start-btn { max-width: 300px; padding: 12px; font-size: 16px; margin: 20px auto 0; z-index: 100; }
        #add-player-btn { background: linear-gradient(135deg, #007aff 0%, #0056b3 100%); box-shadow: 0 4px 15px rgba(0,122,255,0.4); }
        #add-player-btn:hover { background: linear-gradient(135deg, #0066cc 0%, #004494 100%); box-shadow: 0 6px 20px rgba(0,122,255,0.6); }
        #remove-player-btn { background: linear-gradient(135deg, #ff3b30 0%, #cc0000 100%); box-shadow: 0 4px 15px rgba(255,59,48,0.4); display: none; }
        #remove-player-btn:hover { background: linear-gradient(135deg, #cc0000 0%, #990000 100%); box-shadow: 0 6px 20px rgba(255,59,48,0.6); }

        .game-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }
        canvas {
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            border: 3px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            touch-action: none;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px; left: 20px; right: 20px;
            display: none !important;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 20;
        }
        #mobile-controls.visible { display: flex !important; }
        #joystick-area {
            width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2); position: relative; pointer-events: auto; touch-action: none;
            backdrop-filter: blur(4px);
        }
        #joystick-knob { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.4); border: 2px solid rgba(255,255,255,0.6); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        #fire-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255,50,50,0.6);
            border: 3px solid #ff3333;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(255,0,0,0.3);
            user-select: none;
            transition: all 0.3s ease;
            position: relative;
        }
        #fire-btn:active { transform: scale(0.95); }
        #fire-btn.disabled {
            background: rgba(100,100,100,0.6) !important;
            border-color: #666 !important;
            box-shadow: none !important;
            pointer-events: none;
        }
        #fire-btn.disabled::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ff9500;
            border-bottom-color: #ff9500;
            animation: spin 1s linear infinite;
            pointer-events: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #red-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.3); pointer-events: none; border-radius: 12px; opacity: 0; transition: opacity 0.05s; z-index: 15; }
        #red-overlay.active { opacity: 1; }

        #screen-victory { position: relative; min-height: 100vh; justify-content: flex-start; padding-top: 10vh; }
        #victory-cup { font-size: 120px; margin-bottom: 10px; animation: cupBounce 2s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(255,215,0,0.8)); }
        @keyframes cupBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.1); } }
        #victory-text { font-size: clamp(32px, 6vw, 48px); font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 30px rgba(255,255,255,0.8); margin-bottom: 10px; }
        #victory-record { font-size: clamp(28px, 5vw, 42px); font-weight: bold; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.8); margin-bottom: 30px; text-align: center; }
        #next-btn { max-width: 300px; margin-top: auto; margin-bottom: 5vh; z-index: 30; position: relative; }
        .player-name { font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px currentColor; }
        #p3-group, #p4-group { display: none; }

        #record-display {
            font-size: 30px;
            font-weight: 700;
            color: #ffd700;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 25px;
            padding: 10px 20px;
            background: transparent;
            width: 100%;
            text-shadow: 0 0 8px rgba(255,215,0,0.6);
            text-transform: uppercase;
        }

        #menu-btn { margin-top: 10px; width: 200px; padding: 12px; background: #555; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: background 0.3s; flex-shrink: 0; z-index: 30; }
        #menu-btn:hover { background: #777; }

        .pvp-code-block { width: 100%; }
        .pvp-actions-block { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
        .pvp-actions-block button { margin: 0; flex: 1; min-width: 80px; padding: 12px; font-size: 14px; white-space: nowrap; }
        
        /* Стили для кнопки Подключиться (синяя) */
        #pvp-join-btn {
            background: #007aff;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }
        #pvp-join-btn:hover {
            background: #0056b3;
        }
        
        /* Стили для кнопки Отмена (красная) */
        .pvp-cancel-btn {
            background: #ff3b30;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
        .pvp-cancel-btn:hover {
            background: #cc0000;
        }
        
        .pvp-character-block { width: 100%; }
        
        /* Стили для кнопки "Готово" */
        #pvp-ready-btn {
            display: none;
            width: 100%;
            padding: 16px;
            background: #ff9500;
            box-shadow: 0 4px 15px rgba(255,149,0,0.4);
            font-size: 18px;
        }
        #pvp-ready-btn:disabled { opacity: 0.5; pointer-events: none; }
        
        @keyframes readyPulse {
            0% { box-shadow: 0 0 10px rgba(255, 149, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 149, 0, 1); }
            100% { box-shadow: 0 0 10px rgba(255, 149, 0, 0.5); }
        }
        #pvp-ready-btn.ready {
            animation: readyPulse 1.5s infinite;
            background: #ffaa00;
        }

        @media (max-width: 600px) {
            #game-container { padding: 0 5px 5px 5px; gap: 5px; }
            #hud, #survival-hud { padding: 4px 6px; max-height: 30vh; }
            .hud-player { padding: 2px 4px; margin-bottom: 2px; }
            .hp-container { height: 14px; }
            .hp-text { font-size: 9px; }
            .player-name { font-size: 8px; }
            #joystick-area { width: 80px; height: 80px; }
            #joystick-knob { width: 32px; height: 32px; }
            #fire-btn { width: 60px; height: 60px; font-size: 18px; }
            #menu-btn { width: 140px; padding: 10px; font-size: 14px; }
            .mode-tab { font-size: 13px; padding: 8px; }
            #record-display { font-size: 24px; padding: 8px 16px; }
            .pvp-actions-block button { min-width: 60px; padding: 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="menu">
    <h1>⚔️ M8ZKAL GAME ⚔️</h1>
    <div id="mode-tabs">
        <div class="mode-tab active" id="tab-battle">Королевская битва</div>
        <div class="mode-tab" id="tab-survival">Выживание</div>
        <div class="mode-tab" id="tab-pvp">Онлайн-дуэль</div>
    </div>

    <!-- НАСТРОЙКИ КБ -->
    <div id="battle-settings">
        <div class="player-input-group p1-border">
            <label for="p1-name">Имя Игрока 1</label>
            <input type="text" id="p1-name" value="Игрок 1">
            <label style="margin-top:10px; margin-bottom:8px;">Загрузи фото</label>
            <div class="image-preview" id="preview1" onclick="document.getElementById('file1').click()">
                <span class="placeholder">📱 Нажми, чтобы выбрать фото</span>
                <img id="preview1-img" src="" alt="Preview" style="display:none;">
            </div>
            <input type="file" id="file1" accept="image/*" style="display:none;" onchange="loadPhoto('file1', 'preview1', 'preview1-img')">
        </div>
        <div class="player-input-group p2-border">
            <label for="p2-name">Имя Игрока 2</label>
            <input type="text" id="p2-name" value="Игрок 2">
            <label style="margin-top:10px; margin-bottom:8px;">Загрузи фото</label>
            <div class="image-preview" id="preview2" onclick="document.getElementById('file2').click()">
                <span class="placeholder">📱 Нажми, чтобы выбрать фото</span>
                <img id="preview2-img" src="" alt="Preview" style="display:none;">
            </div>
            <input type="file" id="file2" accept="image/*" style="display:none;" onchange="loadPhoto('file2', 'preview2', 'preview2-img')">
        </div>
        <div class="player-input-group p3-border" id="p3-group">
            <label for="p3-name">Имя Игрока 3</label>
            <input type="text" id="p3-name" value="Игрок 3">
            <label style="margin-top:10px; margin-bottom:8px;">Загрузи фото</label>
            <div class="image-preview" id="preview3" onclick="document.getElementById('file3').click()">
                <span class="placeholder">📱 Нажми, чтобы выбрать фото</span>
                <img id="preview3-img" src="" alt="Preview" style="display:none;">
            </div>
            <input type="file" id="file3" accept="image/*" style="display:none;" onchange="loadPhoto('file3', 'preview3', 'preview3-img')">
        </div>
        <div class="player-input-group p4-border" id="p4-group">
            <label for="p4-name">Имя Игрока 4</label>
            <input type="text" id="p4-name" value="Игрок 4">
            <label style="margin-top:10px; margin-bottom:8px;">Загрузи фото</label>
            <div class="image-preview" id="preview4" onclick="document.getElementById('file4').click()">
                <span class="placeholder">📱 Нажми, чтобы выбрать фото</span>
                <img id="preview4-img" src="" alt="Preview" style="display:none;">
            </div>
            <input type="file" id="file4" accept="image/*" style="display:none;" onchange="loadPhoto('file4', 'preview4', 'preview4-img')">
        </div>
        <button id="add-player-btn">Добавить игрока</button>
        <button id="remove-player-btn">Убрать игрока</button>
    </div>

    <!-- НАСТРОЙКИ ВЫЖИВАНИЯ -->
    <div id="survival-settings" style="display: none;">
        <div id="record-display">🏆 Рекорд волн: 0</div>
        <div class="player-input-group p1-border">
            <label for="survival-name">Имя Игрока</label>
            <input type="text" id="survival-name" value="Игрок 1">
            <label style="margin-top:10px; margin-bottom:8px;">Загрузи фото</label>
            <div class="image-preview" id="preview-survival" onclick="document.getElementById('file-survival').click()">
                <span class="placeholder">📱 Нажми, чтобы выбрать фото</span>
                <img id="preview-survival-img" src="" alt="Preview" style="display:none;">
            </div>
            <input type="file" id="file-survival" accept="image/*" style="display:none;" onchange="loadPhoto('file-survival', 'preview-survival', 'preview-survival-img')">
        </div>
    </div>

    <!-- НАСТРОЙКИ PVP (упрощено) -->
    <div id="pvp-settings" style="display: none;">
        <!-- Блок выбора действий (виден изначально) -->
        <div class="pvp-actions-block" id="pvp-selection-buttons">
            <button id="pvp-create-btn">Создать дуэль</button>
            <button id="pvp-join-btn">Подключиться</button>
        </div>

        <!-- Блок ввода/отображения кода комнаты (скрыт изначально) -->
        <div class="pvp-code-block" id="pvp-code-entry" style="display: none;">
            <label for="pvp-room-input">Код комнаты</label>
            <div class="input-wrapper">
                <input type="text" id="pvp-room-input" placeholder="Введите код комнаты">
                <div class="input-buttons">
                    <button class="input-btn paste-btn" id="pvp-paste-btn">📋</button>
                    <button class="input-btn clear-btn" id="pvp-clear-btn">❌</button>
                    <button class="input-btn copy-btn" id="pvp-copy-btn">📃</button>
                </div>
            </div>
        </div>

        <!-- Кнопка отмены (скрыта изначально) -->
        <button id="pvp-cancel-btn" class="pvp-cancel-btn" style="display: none;">Отмена</button>

        <div class="pvp-character-block player-input-group p1-border">
            <label for="pvp-name">Твоё имя</label>
            <input type="text" id="pvp-name" value="Игрок">
            <label style="margin-top:10px; margin-bottom:8px;">Загрузи фото</label>
            <div class="image-preview" id="preview-pvp" onclick="document.getElementById('file-pvp').click()">
                <span class="placeholder">📱 Нажми, чтобы выбрать фото</span>
                <img id="preview-pvp-img" src="" alt="Preview" style="display:none;">
            </div>
            <input type="file" id="file-pvp" accept="image/*" style="display:none;" onchange="loadPhoto('file-pvp', 'preview-pvp', 'preview-pvp-img')">
        </div>
        
        <!-- Кнопка готово (скрыта изначально) -->
        <button id="pvp-ready-btn">Готов</button>
    </div>

    <!-- Общая кнопка Старт (скрывается в PvP) -->
    <button id="start-btn">Старт</button>
</div>

<div id="game-container">
    <div id="hud"></div>
    <div id="survival-hud"></div>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="700" height="700"></canvas>
        <div id="red-overlay"></div>
        <div id="mobile-controls">
            <div id="joystick-area">
                <div id="joystick-knob"></div>
            </div>
            <div id="fire-btn">🔥</div>
        </div>
    </div>
    <button id="menu-btn">Меню</button>
</div>

<div id="screen-victory">
    <div id="victory-cup">🏆</div>
    <div id="victory-text">Победитель</div>
    <div id="victory-record"></div>
    <button id="next-btn">Дальше</button>
</div>

<script>
(function() {
    console.log('Скрипт загружен');

    // ===== FIREBASE =====
    let db = null;
    try {
        const firebaseConfig = {

        const placeholder = preview ? preview.querySelector('.placeholder') : null;
        const file = fileInput.files[0];

        reader.onload = function(event) {
            const dataUrl = event.target.result;
            const imgObj = new Image();
            imgObj.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxSize = 150;
                let width = imgObj.width;
                let height = imgObj.height;
                if (width > height) {
                    if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                } else {
                    if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(imgObj, 0, 0, width, height);
                const compressedUrl = canvas.toDataURL('image/jpeg', 0.7);
                img.src = compressedUrl; img.style.display = 'block';
                if (placeholder) placeholder.style.display = 'none';
                preview.dataset.imageData = compressedUrl;
            };
            imgObj.src = dataUrl;
        };
        reader.readAsDataURL(file);

        const maxDist = rect.width/2 - 20;
        let dx = cx - cxC, dy = cy - cyC;
        const dist = Math.hypot(dx, dy);
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickX = dx / maxDist; joystickY = dy / maxDist; joystickActive = true;
    }
    function handleJoystickMove(cx, cy) {
        if (!joystickActive) return;
        const rect = joystickArea.getBoundingClientRect();
        const cxC = rect.left + rect.width/2, cyC = rect.top + rect.height/2;
        const maxDist = rect.width/2 - 20;
        let dx = cx - cxC, dy = cy - cyC;

        if (!target) return;

    // ===== ЧАСТИЦЫ =====
    function createImpactParticles(x, y, color, count = 6) {
        count = Math.min(count, PARTICLE_LIMIT - particles.length);
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, true));
    }
    class Particle {
        constructor(x, y, color, isImpact = false) {
            this.x = x; this.y = y; this.color = color; this.isImpact = isImpact;
            this.life = 1; this.maxLife = isImpact ? 15 : 20;
            const angle = Math.random() * Math.PI * 2;
            const speed = isImpact ? Math.random() * 6 + 3 : Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.size = isImpact ? Math.random() * 4 + 2 : Math.random() * 3 + 1;
            this.glow = isImpact ? 10 : 5;
        }
        update() { this.x += this.vx; this.y += this.vy; this.vx *= 0.93; this.vy *= 0.93; this.life--; this.size *= 0.98; }
        draw() {
            const alpha = this.life / this.maxLife;
            ctx.globalAlpha = alpha;
            ctx.shadowBlur = this.glow * alpha;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        }
        isDead() { return this.life <= 0; }
    }

    // ===== ИГРОК КБ =====
    class PlayerBattle {
        constructor(x, y, color, borderColor, name, index) {
            this.x = x; this.y = y;
            const angle = (Math.PI * 2 / currentPlayerCount) * index;
            const speed = 5;
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.radius = PLAYER_RADIUS_BATTLE; this.color = color; this.borderColor = borderColor;
            this.name = name; this.index = index; this.hp = 100; this.dead = false;
            this.angle = Math.random() * Math.PI * 2; this.rotSpeed = (index % 2 === 0 ? 1 : -1) * 0.1;
            this.swordLength = 85; this.swordWidth = 10; this.lastHitTime = 0;
            this.trailPoints = []; this.maxTrailPoints = MAX_TRAIL_POINTS;
            this.bounceForce = 1.1; this.minSpeed = 2.5; this.maxSpeed = 10;
            this.randomAngle = Math.random() * Math.PI * 2; this.randomChangeTimer = 0; this.randomForce = 0;
            this.imageLoaded = false; this.image = new Image();
        }
        update() {
            this.angle += this.rotSpeed;
            this.randomChangeTimer--;
            if (this.randomChangeTimer <= 0) { this.randomAngle += (Math.random() - 0.5) * 1.5; this.randomForce = Math.random() * 0.3 + 0.1; this.randomChangeTimer = Math.floor(Math.random() * 30) + 15; }
            this.vx += Math.cos(this.randomAngle) * this.randomForce; this.vy += Math.sin(this.randomAngle) * this.randomForce;
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.997; this.vy *= 0.997;
            const currentSpeed = Math.hypot(this.vx, this.vy);
            if (currentSpeed < this.minSpeed) { const a = Math.atan2(this.vy, this.vx) + (Math.random() - 0.5) * 0.5; this.vx = Math.cos(a) * this.minSpeed; this.vy = Math.sin(a) * this.minSpeed; }
            if (currentSpeed > this.maxSpeed) { this.vx = (this.vx / currentSpeed) * this.maxSpeed; this.vy = (this.vy / currentSpeed) * this.maxSpeed; }
            if (this.x - this.radius < 0) { this.x = this.radius; this.vx = Math.abs(this.vx) * this.bounceForce; this.randomAngle = Math.random() * Math.PI; }
            else if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx = -Math.abs(this.vx) * this.bounceForce; this.randomAngle = Math.PI + Math.random() * Math.PI; }
            if (this.y - this.radius < 0) { this.y = this.radius; this.vy = Math.abs(this.vy) * this.bounceForce; this.randomAngle = Math.random() * Math.PI * 2; }
            else if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy = -Math.abs(this.vy) * this.bounceForce; this.randomAngle = Math.random() * Math.PI * 2; }
            if (this.trailPoints.length >= this.maxTrailPoints) this.trailPoints.shift();
            this.trailPoints.push({x: this.x, y: this.y});
        }
        getSwordTip() { return { x: this.x + Math.cos(this.angle) * (this.radius + this.swordLength), y: this.y + Math.sin(this.angle) * (this.radius + this.swordLength) }; }
        draw() {
            if (this.trailPoints.length > 2) {
                for (let i = 1; i < this.trailPoints.length; i++) {
                    const alpha = (i / this.trailPoints.length) * 0.25;
                    const radius = (i / this.trailPoints.length) * this.radius * 0.35;
                    ctx.globalAlpha = alpha; ctx.fillStyle = this.borderColor; ctx.shadowBlur = 5; ctx.shadowColor = this.borderColor;
                    ctx.beginPath(); ctx.arc(this.trailPoints[i].x, this.trailPoints[i].y, radius, 0, Math.PI * 2); ctx.fill();
                } ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            }
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
            ctx.shadowBlur = 15; ctx.shadowColor = this.borderColor;
            ctx.fillStyle = '#8B4513'; ctx.fillRect(this.radius - 5, -4, 14, 14);

    // ===== ЛОГИКА БИТВЫ (КБ) =====
    function handleBallCollision(b1, b2) {
        if (b1.dead || b2.dead) return;
        const dx = b2.x - b1.x, dy = b2.y - b1.y;
        const distSq = dx * dx + dy * dy; const minDist = b1.radius + b2.radius;
        if (distSq >= minDist * minDist) return;
        const dist = Math.sqrt(distSq); if (dist === 0) return;
        const nx = dx / dist, ny = dy / dist; const overlap = minDist - dist;
        b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2; b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;
        const rb = Math.random() * 0.5 + 1.2; const relVx = b1.vx - b2.vx, relVy = b1.vy - b2.vy;
        const relV = relVx * nx + relVy * ny;
        if (relV > 0) { b1.vx -= (relV * rb * nx); b1.vy -= (relV * rb * ny); b2.vx += (relV * rb * nx); b2.vy += (relV * rb * ny); }
        const midX = (b1.x + b2.x) / 2, midY = (b1.y + b2.y) / 2;
        createImpactParticles(midX, midY, b1.color, 6); createImpactParticles(midX, midY, b2.color, 6); playSound('collision');
        [b1, b2].forEach(ball => { if (Math.hypot(ball.vx, ball.vy) < ball.minSpeed) { const a = Math.random() * Math.PI * 2; ball.vx = Math.cos(a) * ball.minSpeed; ball.vy = Math.sin(a) * ball.minSpeed; } });
    }
    function checkSwordHit(attacker, defender) {
        if (attacker.dead || defender.dead) return;
        const tip = attacker.getSwordTip(); const dx = defender.x - tip.x, dy = defender.y - tip.y;
        const distSq = dx * dx + dy * dy; const hitRadius = defender.radius + 15;
        if (distSq >= hitRadius * hitRadius) return;
        const now = Date.now(); if (now - attacker.lastHitTime < 200) return;
        attacker.lastHitTime = now; const damage = Math.floor(Math.random() * 8) + 10; defender.hp -= damage;
        if (defender.hp < 0) defender.hp = 0;
        const pushAngle = Math.atan2(dy, dx); const pushForce = 15;
        defender.vx += Math.cos(pushAngle) * pushForce; defender.vy += Math.sin(pushAngle) * pushForce; defender.randomAngle = Math.random() * Math.PI * 2;
        createImpactParticles(tip.x, tip.y, defender.borderColor); createImpactParticles(defender.x, defender.y, '#ffdd00'); playSound('hit');
        if (defender.hp <= 0) { defender.dead = true; createImpactParticles(defender.x, defender.y, defender.borderColor, 12); createImpactParticles(defender.x, defender.y, '#ffffff', 8); for (let i=0; i<20; i++) { const a=Math.random()*Math.PI*2, s=Math.random()*8+2; particles.push(new Particle(defender.x+(Math.random()-0.5)*20, defender.y+(Math.random()-0.5)*20, '#ffaa00', true)); particles[particles.length-1].vx = Math.cos(a)*s; particles[particles.length-1].vy = Math.sin(a)*s; particles[particles.length-1].maxLife = 20; } }
        updateHUD(); checkGameOver();
    }

                nextBtn.textContent = 'Дальше'; setTimeout(() => { gameContainer.style.display = 'none'; screenVictory.style.display = 'flex'; }, 800);

    function spawnEnemyForWave() {
        if (!isWaveInProgress) return;
        if (enemiesSpawnedInWave >= enemiesPerWave) {
            const alive = enemies.filter(e => !e.dead);
            if (alive.length === 0) { isWaveInProgress = false; if (wave % 5 === 0 && !bossSpawned) { bossSpawned = true; spawnBoss(); } else { waveDelay = WAVE_DELAY; } }
            return;
        }
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if (side === 0) { x = Math.random() * canvas.width; y = -30; } else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 30; } else if (side === 2) { x = -30; y = Math.random() * canvas.height; } else { x = canvas.width + 30; y = Math.random() * canvas.height; }
        const rand = Math.random(); let type = 'normal'; let hp = enemyHPBase + wave * 1.5; let speed = enemySpeedBase + wave * 0.12; let radius = ENEMY_RADIUS;
        if (rand < 0.3) { type = 'fast'; hp = enemyHPBase * 0.8 + wave * 1.0; speed = enemySpeedBase * 1.6 + wave * 0.15; radius = ENEMY_RADIUS * 0.8; }
        else if (rand < 0.6) { type = 'tank'; hp = enemyHPBase * 2.5 + wave * 2.0; speed = enemySpeedBase * 0.7 + wave * 0.08; radius = ENEMY_RADIUS * 1.3; }
        if (hp < 2) hp = 2;

    // ================================================================
    // PVP (simple-peer + Firebase) с защитой от двойных сигналов
    // ================================================================
    let pvpProcessingSignal = false;

    function generateRoomCode() {
        return 'room-' + Math.random().toString(36).substring(2, 8);
    }

    function createPvpRoom() {
        if (!db) { alert('Firebase недоступен'); return; }
        const code = generateRoomCode();
        pvpRoomCode = code;
        pvpIsCreator = true;
        
        // Новая логика интерфейса
        pvpSelectionButtons.style.display = 'none';
        pvpCodeEntry.style.display = 'block';
        pvpRoomInput.value = code;
        pvpRoomInput.disabled = true;
        pvpCancelBtn.style.display = 'block';
        pvpReadyBtn.style.display = 'block';
        pvpReadyBtn.disabled = false;
        pvpReadyBtn.classList.remove('ready');

        pvpRoomRef = db.ref('rooms/' + code);
        pvpRoomRef.set({
            status: 'waiting',
            creatorReady: false,
            joinerReady: false,
            offer: null,
            answer: null,
            ice: []
        });

        pvpPeer = new SimplePeer({ initiator: true, trickle: true, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
        setupPvpPeerEvents();

        pvpRoomRef.on('value', function(snapshot) {
            const data = snapshot.val();
            if (!data) return;
            if (data.status === 'joined') {
                // уже показываем кнопку "Готов" (она уже видна)
            }
            if (data.status === 'ready') {
                if (!pvpConnected) startPvpDuel();
            }
            if (!pvpConnected && !pvpProcessingSignal && pvpPeer && !pvpPeer.destroyed) {
                if (pvpIsCreator && data.answer) {
                    pvpProcessingSignal = true;
                    try {
                        pvpPeer.signal(JSON.parse(data.answer));
                        pvpRoomRef.child('answer').set(null);
                    } catch(e) { console.warn('signal(answer) error:', e); }
                    pvpProcessingSignal = false;
                }
                if (!pvpIsCreator && data.offer) {
                    pvpProcessingSignal = true;
                    try {
                        pvpPeer.signal(JSON.parse(data.offer));
                    } catch(e) { console.warn('signal(offer) error:', e); }
                    pvpProcessingSignal = false;
                }
                if (data.ice && data.ice.length > 0) {
                    data.ice.forEach(function(candidate) {
                        if (!pvpConnected && pvpPeer && !pvpPeer.destroyed) {
                            try { pvpPeer.signal(candidate); } catch(e) {}
                        }
                    });
                    pvpRoomRef.child('ice').set([]);
                }
            }
        });
    }

    function joinPvpRoom(code) {
        if (!db) { alert('Firebase недоступен'); return; }
        if (pvpPeer) return; // Предотвращаем повторное подключение

        pvpRoomCode = code;
        pvpIsCreator = false;
        
        // Установка UI (код уже был введен пользователем)
        pvpSelectionButtons.style.display = 'none';
        pvpCodeEntry.style.display = 'block';
        pvpRoomInput.value = code;
        pvpRoomInput.disabled = true;
        pvpCancelBtn.style.display = 'block';
        pvpReadyBtn.style.display = 'block';
        pvpReadyBtn.disabled = false;

        pvpRoomRef = db.ref('rooms/' + code);
        pvpRoomRef.once('value', function(snapshot) {
            const data = snapshot.val();
            if (!data || data.status === 'waiting') {
                pvpPeer = new SimplePeer({ initiator: false, trickle: true, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
                setupPvpPeerEvents();

                pvpRoomRef.on('value', function(snap) {
                    const d = snap.val();
                    if (!d) return;
                    if (d.status === 'ready') {
                        if (!pvpConnected) startPvpDuel();
                    }
                    if (!pvpConnected && !pvpProcessingSignal && pvpPeer && !pvpPeer.destroyed) {
                        if (!pvpIsCreator && d.offer) {
                            pvpProcessingSignal = true;
                            try {
                                pvpPeer.signal(JSON.parse(d.offer));
                            } catch(e) { console.warn('signal(offer) error:', e); }
                            pvpProcessingSignal = false;
                        }
                        if (pvpIsCreator && d.answer) {
                            pvpProcessingSignal = true;
                            try {
                                pvpPeer.signal(JSON.parse(d.answer));
                            } catch(e) { console.warn('signal(answer) error:', e); }
                            pvpProcessingSignal = false;
                        }
                        if (d.ice && d.ice.length > 0) {
                            d.ice.forEach(function(c) {
                                if (!pvpConnected && pvpPeer && !pvpPeer.destroyed) {
                                    try { pvpPeer.signal(c); } catch(e) {}
                                }
                            });
                            pvpRoomRef.child('ice').set([]);
                        }
                    }
                });

                pvpRoomRef.update({ status: 'joined' });
            } else {
                alert('Комната не найдена или уже занята.');
                cancelPvp();
            }
        });
    }

    function setupPvpPeerEvents() {
        pvpPeer.on('signal', function(data) {
            if (pvpPeer.destroyed) return;
            if (data.type === 'offer') {
                if (pvpRoomRef) pvpRoomRef.child('offer').set(JSON.stringify(data));
            } else if (data.type === 'answer') {
                if (pvpRoomRef) pvpRoomRef.child('answer').set(JSON.stringify(data));
            } else if (data.candidate) {
                if (pvpRoomRef) pvpRoomRef.child('ice').push(data);
            }
        });

        pvpPeer.on('connect', function() {
            console.log('PvP соединение установлено!');
            pvpConnected = true;
            if (pvpRoomRef) {
                pvpRoomRef.child('offer').set(null);
                pvpRoomRef.child('answer').set(null);
                pvpRoomRef.child('ice').set([]);
            }
            if (!pvpIsCreator) {
                pvpRoomRef.update({ joinerReady: true });
                pvpRoomRef.once('value', function(snap) {
                    const d = snap.val();
                    if (d && d.creatorReady && d.joinerReady) {
                        pvpRoomRef.update({ status: 'ready' });
                    }
                });
            } else {
                pvpRoomRef.update({ creatorReady: true });
                pvpRoomRef.once('value', function(snap) {
                    const d = snap.val();
                    if (d && d.creatorReady && d.joinerReady) {
                        pvpRoomRef.update({ status: 'ready' });
                    }
                });
            }
        });

        pvpPeer.on('data', function(data) {
            try {
                const parsed = JSON.parse(data);
                handlePvpData(parsed);
            } catch(e) {}
        });

        pvpPeer.on('error', function(err) {
            console.error('PvP ошибка:', err);
            alert('Ошибка соединения: ' + err.message);
            cancelPvp();
            goToMenu();
        });

        pvpPeer.on('close', function() {
            pvpConnected = false;
            console.log('PvP соединение закрыто');
            cancelPvp();
        });
    }

    function sendPvpData(data) {
        if (pvpPeer && pvpConnected && !pvpPeer.destroyed) {
            pvpPeer.send(JSON.stringify(data));
        }
    }

    function handlePvpData(data) {
        if (!pvpOtherPlayer) return;
        if (data.type === 'init') {
            pvpOtherPlayer.name = data.name;
            pvpOtherPlayer.color = data.color;
            pvpOtherPlayer.borderColor = data.border;
        } else if (data.type === 'move') {
            pvpOtherPlayer.x = data.x;
            pvpOtherPlayer.y = data.y;
        } else if (data.type === 'shoot') {
            const myPlayer = players[0];
            if (myPlayer && !myPlayer.dead) {
                const dmg = data.damage || PLAYER_DAMAGE;
                myPlayer.hp -= dmg;
                if (myPlayer.hp < 0) myPlayer.hp = 0;
                showRedScreen();
                playSound('damage');
                if (myPlayer.hp <= 0) {
                    myPlayer.dead = true;
                    gameActive = false;
                    victoryCup.textContent = '💀';
                    victoryText.innerText = 'Вы проиграли!';
                    victoryText.style.color = '#ff3b30';
                    victoryRecord.innerText = '';
                    playSound('victory');
                    nextBtn.textContent = 'В меню';
                    setTimeout(() => {
                        gameContainer.style.display = 'none';
                        screenVictory.style.display = 'flex';
                    }, 800);
                }
            }
        } else if (data.type === 'victory') {
            gameActive = false;
            victoryCup.textContent = '🏆';
            victoryText.innerText = 'Вы победили!';
            victoryText.style.color = '#ffd700';
            victoryRecord.innerText = '';
            playSound('victory');
            nextBtn.textContent = 'Дальше';
            setTimeout(() => {
                gameContainer.style.display = 'none';
                screenVictory.style.display = 'flex';
            }, 800);
        }
    }

    function pvpGameLoop() {
        if (!gameActive) {
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            return;
        }
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (redScreenTimer > 0) { redScreenTimer--; if (redScreenTimer === 0) redOverlay.classList.remove('active'); }

        const myPlayer = players[0];
        if (myPlayer && !myPlayer.dead) {
            let dx = 0, dy = 0;
            if (joystickActive) { dx = joystickX * PLAYER_SPEED; dy = joystickY * PLAYER_SPEED; }
            else {
                if (keys.w || keys.ArrowUp) dy = -PLAYER_SPEED;
                if (keys.s || keys.ArrowDown) dy = PLAYER_SPEED;
                if (keys.a || keys.ArrowLeft) dx = -PLAYER_SPEED;
                if (keys.d || keys.ArrowRight) dx = PLAYER_SPEED;
            }
            if (dx !== 0 || dy !== 0) {
                myPlayer.update(dx, dy);
                sendPvpData({ type: 'move', x: myPlayer.x, y: myPlayer.y });
            }

            if (pvpShootCooldown > 0) { pvpShootCooldown--; }
            if (pvpIsReloading) {
                pvpReloadTimer--;
                if (pvpReloadTimer <= 0) {
                    pvpIsReloading = false;
                    fireBtn.classList.remove('disabled');
                    if (!pvpReloadSoundPlayed) {
                        playSound('reload_done');
                        pvpReloadSoundPlayed = true;
                    }
                }
            }
        }

        if (myPlayer && !myPlayer.dead) myPlayer.draw();
        if (pvpOtherPlayer && !pvpOtherPlayer.dead) pvpOtherPlayer.draw();

        updateParticles();
        drawParticles();

        animationFrameId = requestAnimationFrame(pvpGameLoop);
    }

    // ===== ИГРОВОЙ ЦИКЛ (КБ и Выживание) =====
    function gameLoop() {
        if (!gameActive) return;
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (redScreenTimer > 0) { redScreenTimer--; if (redScreenTimer === 0) redOverlay.classList.remove('active'); }

        if (currentMode === 'battle') {
            players.forEach(p => { if (!p.dead) p.update(); });
            for (let i=0; i<players.length; i++) { if (players[i].dead) continue; for (let j=i+1; j<players.length; j++) { if (players[j].dead) continue; handleBallCollision(players[i], players[j]); } }
            for (let i=0; i<players.length; i++) { if (players[i].dead) continue; for (let j=0; j<players.length; j++) { if (i===j || players[j].dead) continue; checkSwordHit(players[i], players[j]); } }
            players.forEach(p => { if (!p.dead) p.draw(); });
        } else if (currentMode === 'survival') {
            const player = players[0];
            if (!player || player.dead) { /* ничего */ } else {
                player.update();
                if (waveMessageTimer > 0) waveMessageTimer--; else waveMessage = '';
                if (!isWaveInProgress && waveDelay > 0) { waveDelay--; if (waveDelay === 0) startWave(); }
                else if (!isWaveInProgress && waveDelay === 0) startWave();
                if (isWaveInProgress) { spawnTimer++; if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnEnemyForWave(); } }

                for (const enemy of enemies) {
                    if (enemy.dead) continue;
                    const dx = player.x - enemy.x, dy = player.y - enemy.y; const dist = Math.hypot(dx, dy);
                    if (dist > 1) { enemy.x += (dx / dist) * enemy.speed; enemy.y += (dy / dist) * enemy.speed; }
                    if (dist < player.radius + enemy.radius) {
                        player.hp -= ENEMY_DAMAGE; if (player.hp < 0) player.hp = 0;
                        if (player.hp <= 0) { player.dead = true; createImpactParticles(player.x, player.y, '#ff0000', 30); }
                        enemy.hp -= 5; if (enemy.hp <= 0) { enemy.dead = true; createImpactParticles(enemy.x, enemy.y, '#ff4444', 15); }
                        createImpactParticles(enemy.x, enemy.y, '#ff4444', 10); playSound('damage'); showRedScreen(); updateHUD(); checkGameOver();
                    }
                }

                for (let i=bullets.length-1; i>=0; i--) {
                    const b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
                    if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) { bullets.splice(i, 1); continue; }
                    ctx.shadowBlur = 15; ctx.shadowColor = '#ffdd44'; ctx.fillStyle = '#ffdd44'; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
                    if (b.owner === 'player') {
                        for (const enemy of enemies) {
                            if (enemy.dead) continue;
                            const d = Math.hypot(b.x - enemy.x, b.y - enemy.y);
                            if (d < enemy.radius + b.radius) {
                                const damage = PLAYER_DAMAGE; enemy.hp -= damage; createImpactParticles(b.x, b.y, '#ffdd44', 6);
                                if (enemy.hp <= 0) { enemy.dead = true; if (enemy.isBoss) { isWaveInProgress = false; waveDelay = WAVE_DELAY; spawnMedkit(enemy.x, enemy.y); } createImpactParticles(enemy.x, enemy.y, '#ffffff', 15); playSound('hit'); updateHUD(); checkGameOver(); }
                                bullets.splice(i, 1); break;
                            }
                        }
                    }
                }

                enemies = enemies.filter(e => !e.dead);
                if (isWaveInProgress && enemies.length === 0 && enemiesSpawnedInWave >= enemiesPerWave) { isWaveInProgress = false; if (wave % 5 === 0 && !bossSpawned) { bossSpawned = true; spawnBoss(); } else { waveDelay = WAVE_DELAY; } }

                for (let i=items.length-1; i>=0; i--) {
                    const item = items[i]; item.life--; if (item.life <= 0) { items.splice(i, 1); continue; }
                    const d = Math.hypot(item.x - player.x, item.y - player.y);
                    if (d < player.radius + item.radius) {
                        if (item.type === 'medkit') { player.hp = Math.min(100, player.hp + 25); playSound('medkit'); createImpactParticles(item.x, item.y, '#00ff44', 15); }
                        items.splice(i, 1); updateHUD();
                    }
                }
            }

            for (const enemy of enemies) {
                if (enemy.dead) continue;
                ctx.shadowBlur = enemy.isBoss ? 30 : 15; ctx.shadowColor = enemy.isBoss ? '#884444' : '#888888';
                ctx.fillStyle = enemy.isBoss ? '#886666' : '#aaaaaa'; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.strokeStyle = '#666666'; ctx.lineWidth = enemy.isBoss ? 3 : 2; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI*2); ctx.stroke();
                const hpP = enemy.hp / enemy.maxHp; ctx.fillStyle = '#ff0000'; ctx.fillRect(enemy.x - enemy.radius, enemy.y - enemy.radius - 10, enemy.radius*2, 4); ctx.fillStyle = '#00ff00'; ctx.fillRect(enemy.x - enemy.radius, enemy.y - enemy.radius - 10, enemy.radius*2*hpP, 4);
                if (enemy.isBoss) { ctx.shadowBlur = 15; ctx.shadowColor = '#ff8888'; ctx.fillStyle = '#ff8888'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.fillText('БОСС', enemy.x, enemy.y - enemy.radius - 20); ctx.shadowBlur = 0; }
            }

            for (const item of items) { item.pulse += 0.05; const glow = Math.sin(item.pulse)*0.2 + 0.8; ctx.shadowBlur = 25*glow; ctx.shadowColor = '#00ff44'; ctx.fillStyle = '#00cc44'; ctx.beginPath(); ctx.arc(item.x, item.y, item.radius*glow, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', item.x, item.y+2); }

            if (player) player.draw();

            if (waveMessage && waveMessageTimer > 0) {
                ctx.save();
                ctx.shadowBlur = 20; ctx.shadowColor = '#ffd700';
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(waveMessage, canvas.width / 2, 20);
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            checkGameOver();
        }

        updateParticles(); drawParticles();
        animationFrameId = requestAnimationFrame(gameLoop);
    }
